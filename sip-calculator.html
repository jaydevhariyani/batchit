<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SIP Calculator</title>
  <link rel="stylesheet" href="../style.css">
</head>
<body>
  <header>
    <div class="container">
      <a href="../index.html" class="logo">Utility Tools</a>
    </div>
  </header>
  <div class="tool-page container">
    <div class="tool-box">
      <h1>SIP Calculator</h1>
      <label>Monthly Investment (?)</label>
      <input type="number" id="monthly" value="5000">
      <label>Expected Return (% p.a.)</label>
      <input type="number" id="rate" value="12" step="0.1">
      <label>Time Period (Years)</label>
      <input type="number" id="years" value="10">
      <button onclick="calc()">Calculate</button>
      <div id="result" class="result"></div>
    </div>
  </div>
  <script>
    function calc() {
      const P = +document.getElementById('monthly').value;
      const r = +document.getElementById('rate').value / 12 / 100;
      const n = +document.getElementById('years').value * 12;
      const fv = P * ((Math.pow(1+r, n) - 1) / r) * (1+r);
      const invested = P * n;
      document.getElementById('result').innerHTML = `
        Invested Amount: <b>?${invested.toLocaleString()}</b><br>
        Estimated Returns: <b>?${(fv-invested).toFixed(0)}</b><br>
        Total Value: <b>?${fv.toFixed(0)}</b>
      `;
    }
  </script>
</body>
</html>
