<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EMI Calculator</title>
  <link rel="stylesheet" href="../style.css">
</head>
<body>
  <header>
    <div class="container">
      <a href="../index.html" class="logo">Utility Tools</a>
    </div>
  </header>
  <div class="tool-page container">
    <div class="tool-box">
      <h1>EMI Calculator</h1>
      <label>Loan Amount (?)</label>
      <input type="number" id="amount" value="500000">
      <label>Interest Rate (% p.a.)</label>
      <input type="number" id="rate" value="8.5" step="0.1">
      <label>Tenure (Years)</label>
      <input type="number" id="years" value="5">
      <button onclick="calc()">Calculate EMI</button>
      <div id="result" class="result"></div>
    </div>
  </div>
  <script>
    function calc() {
      const P = +document.getElementById('amount').value;
      const r = +document.getElementById('rate').value / 12 / 100;
      const n = +document.getElementById('years').value * 12;
      const emi = P * r * Math.pow(1+r, n) / (Math.pow(1+r, n) - 1);
      const total = emi * n;
      document.getElementById('result').innerHTML = `
        Monthly EMI: <b>?${emi.toFixed(0)}</b><br>
        Total Payment: <b>?${total.toFixed(0)}</b><br>
        Total Interest: <b>?${(total-P).toFixed(0)}</b>
      `;
    }
  </script>
</body>
</html>
