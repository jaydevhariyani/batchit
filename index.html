<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Batchit - A free private and global online chatting app.">
    <meta name="keywords" content="global chat, private chat, online chatting, AI chat">
    <meta name="author" content="Batchit Chat">
    <meta name="robots" content="index, follow">
    <title>Batchit - Private & Global Chatting App</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        .online-dot { width: 10px; height: 10px; background-color: #25D366; border-radius: 50%; border: 2px solid white; position: absolute; bottom: 0; right: 0; }
        .offline-dot { background-color: #ccc; }
        .ad-container { background: #f8f9fa; border: 1px dashed #ccc; text-align: center; color: #888; display: flex; align-items: center; justify-content: center;}
        .top-ad { width: 100%; height: 60px; margin-bottom: 10px; }
        .sidebar-ad { width: 100%; height: 250px; margin-top: 15px; }
        .tab-btn { padding: 10px; border: none; cursor: pointer; flex: 1; font-weight: bold; }
        .tab-active { background: #0084ff; color: white; }
        .tab-inactive { background: #e9ecef; color: #333; }

        /* DARK MODE CSS */
        body.dark-mode { background: #18191a; color: #e4e6eb; }
        body.dark-mode #auth-page { background: #18191a; }
        body.dark-mode #auth-page > div { background: #242526; color: #e4e6eb; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        body.dark-mode .top-header, 
        body.dark-mode #chat-header-container, 
        body.dark-mode #input-area, 
        body.dark-mode .sidebar { background: #242526 !important; border-color: #3e4042 !important; }
        body.dark-mode .chat-area { background: #18191a !important; }
        body.dark-mode .message-other { background: #3a3b3c !important; color: #e4e6eb !important; border-color: #3e4042 !important; }
        body.dark-mode input, body.dark-mode select { background: #3a3b3c !important; color: white !important; border-color: #555 !important; }
        body.dark-mode .sidebar-tabs { border-color: #3e4042 !important; }
        body.dark-mode .tab-inactive { background: #3a3b3c !important; color: #e4e6eb !important; }
        body.dark-mode #chat-header-title { color: #e4e6eb !important; }
        body.dark-mode .ad-container { background: #3a3b3c; border-color: #555; color: #aaa; }
        body.dark-mode #all-users-list > div { border-color: #3e4042 !important; }
        body.dark-mode strong { color: #e4e6eb !important; }
    </style>
</head>
<body>

    <!-- LOGIN / REGISTER PAGE -->
    <div id="auth-page" style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; background: #f0f2f5;">
        <div style="background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 300px; text-align: center;">
            <h2 style="color: #0084ff; margin-bottom: 20px;"><i class="fa-solid fa-comments"></i> Batchit</h2>
            <input type="email" id="email-input" placeholder="Email Address" style="width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 5px;">
            <input type="password" id="password-input" placeholder="Password" style="width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 5px;">
            
            <select id="gender-input" style="width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 5px; background: white;">
                <option value="" disabled selected>Select Gender</option>
                <option value="Male">Male 👦</option>
                <option value="Female">Female 👧</option>
            </select>
            
            <button id="login-btn" style="width: 100%; padding: 10px; background: #0084ff; color: white; border: none; border-radius: 5px; cursor: pointer; margin-bottom: 10px; font-weight: bold;">Login</button>
            <button id="register-btn" style="width: 100%; padding: 10px; background: #25D366; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold;">Create New Account</button>
        </div>
    </div>

    <!-- MAIN CHAT APP -->
    <div id="main-app" style="display: none;">
        <header class="top-header" style="display: flex; justify-content: space-between; align-items: center; padding: 15px; background: white; border-bottom: 1px solid #ddd;">
            <div class="logo" style="font-weight: bold; font-size: 20px; color: #0084ff;"><i class="fa-solid fa-comments"></i> Batchit</div>
            
            <div style="display: flex; align-items: center;">
                <!-- DARK MODE BUTTON -->
                <button id="theme-toggle" style="background: none; border: none; font-size: 20px; cursor: pointer; margin-right: 20px; color: #0084ff;" title="Toggle Dark Mode"><i class="fa-solid fa-moon"></i></button>
                <button id="logout-btn" style="background: #dc3545; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; font-weight: bold;"><i class="fa-solid fa-right-from-bracket"></i> Logout</button>
            </div>
        </header>

        <div class="main-container" style="display: flex; height: calc(100vh - 60px);">
            <aside class="sidebar" style="width: 300px; border-right: 1px solid #ddd; display: flex; flex-direction: column;">
                <div class="sidebar-tabs" style="display: flex; border-bottom: 1px solid #ddd;">
                    <button class="tab-btn tab-active" id="tab-private">Private</button>
                    <button class="tab-btn tab-inactive" id="tab-global" style="background: #25D366; color: white;">Global Room</button>
                </div>
                
                <div class="users-list" style="overflow-y: auto; flex: 1;">
                    <div id="all-users-list"></div>
                </div>

                <div class="ad-container sidebar-ad">
                    <small>AdSense Space (300x250)</small>
                </div>
            </aside>

            <main class="chat-area" style="flex: 1; display: flex; flex-direction: column; background: #e9ecef;">
                <div class="ad-container top-ad">
                    <small>AdSense Leaderboard Banner (728x90)</small>
                </div>

                <div class="welcome-banner" id="chat-header-container" style="background: white; padding: 15px; border-bottom: 1px solid #ddd; display: flex; justify-content: space-between; align-items: center;">
                    <h2 id="chat-header-title" style="margin: 0; font-size: 18px; color: #333;">Select a user to chat</h2>
                    <button id="block-user-btn" style="display: none; background: #dc3545; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; font-weight: bold;"><i class="fa-solid fa-ban"></i> Block User</button>
                </div>

                <div class="chat-box" id="chat-box" style="flex: 1; overflow-y: auto; padding: 20px;"></div>

                <div class="message-input-area" id="input-area" style="display: none; padding: 15px; background: white; border-top: 1px solid #ddd; align-items: center;">
                    <input type="file" id="image-input" accept="image/*" style="display: none;">
                    <button id="img-btn" type="button" style="background: none; border: none; font-size: 24px; cursor: pointer; margin-right: 10px;">📎</button>
                    <input type="text" id="message-input" placeholder="Type a message..." style="flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 20px; margin-right: 10px;">
                    <button id="send-btn" style="background: #0084ff; color: white; border: none; width: 40px; height: 40px; border-radius: 50%; cursor: pointer;"><i class="fa-solid fa-paper-plane"></i></button>
                </div>
            </main>
        </div>
    </div>

    <script>
        let script = document.createElement('script');
        script.type = 'module';
        script.src = 'script.js?v=' + new Date().getTime();
        document.body.appendChild(script);
    </script>
</body>
</html>
